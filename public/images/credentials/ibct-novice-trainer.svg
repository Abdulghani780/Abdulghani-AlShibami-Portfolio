<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="850" fill="url(#bgGrad)" />

  <!-- Outer Luxury Gold Border -->
  <rect x="25" y="25" width="1150" height="800" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85" />
  <rect x="40" y="40" width="1120" height="770" rx="12" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Corner Geometric Badges -->
  <polygon points="25,25 75,25 25,75" fill="url(#goldGrad)" opacity="0.6" />
  <polygon points="1175,25 1125,25 1175,75" fill="url(#goldGrad)" opacity="0.6" />
  <polygon points="25,825 75,825 25,775" fill="url(#goldGrad)" opacity="0.6" />
  <polygon points="1175,825 1125,825 1175,775" fill="url(#goldGrad)" opacity="0.6" />

  <!-- Watermark / Security Crest -->
  <circle cx="600" cy="440" r="180" fill="none" stroke="#1E293B" stroke-width="2" opacity="0.4" />
  <circle cx="600" cy="440" r="150" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4 6" opacity="0.15" />

  <!-- Header Branding: IBCT & EDRAAK -->
  <g transform="translate(100, 90)">
    <!-- IBCT Logo Mark -->
    <rect x="0" y="0" width="54" height="54" rx="10" fill="#1E293B" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="27" y="34" font-family="'JetBrains Mono', monospace, sans-serif" font-size="20" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">IBCT</text>
    <text x="70" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">INTERNATIONAL BOARD OF</text>
    <text x="70" y="44" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="url(#goldGrad)" letter-spacing="1.5">CERTIFIED TRAINERS</text>
  </g>

  <g transform="translate(900, 90)">
    <!-- Edraak Badge -->
    <rect x="0" y="0" width="200" height="48" rx="8" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.5" />
    <text x="100" y="30" font-family="'Cairo', sans-serif" font-size="18" font-weight="800" fill="#38BDF8" text-anchor="middle">إدراك | EDRAAK</text>
  </g>

  <!-- Certificate Sub-kicker -->
  <text x="600" y="230" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="4" text-anchor="middle">CERTIFICATE OF TRAINING COMPLETION</text>
  <line x1="420" y1="245" x2="780" y2="245" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7" />

  <!-- Main Certificate Title -->
  <text x="600" y="310" font-family="'Inter', serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TRAIN-THE-TRAINER PROGRAM</text>
  <text x="600" y="355" font-family="'Inter', sans-serif" font-size="22" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">THE NOVICE TRAINER LEVEL</text>
  <text x="600" y="390" font-family="'Cairo', sans-serif" font-size="20" font-weight="700" fill="#94A3B8" text-anchor="middle">برنامج تدريب المدربين: مستوى المدرب المبتدئ</text>

  <!-- Recipient Section -->
  <text x="600" y="445" font-family="'Inter', sans-serif" font-size="13" fill="#64748B" text-anchor="middle" letter-spacing="2">THIS CREDENTIAL IS PROUDLY CONFERRED UPON</text>
  
  <text x="600" y="505" font-family="'Inter', serif" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">Abdulghani Ali Mohammed Ahmed Al-Shibami</text>
  <text x="600" y="545" font-family="'Cairo', serif" font-size="26" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">عبدالغني علي محمد أحمد الشبامي</text>

  <!-- Description paragraph -->
  <text x="600" y="595" font-family="'Inter', sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle" max-width="800">
    In formal recognition of fulfilling all instructional competencies, professional training methodologies,
  </text>
  <text x="600" y="618" font-family="'Inter', sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">
    and peer-reviewed presentation delivery standards under the International Board of Certified Trainers guidelines.
  </text>

  <!-- Footer Verification Seal & Metadata -->
  <g transform="translate(140, 680)">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">ISSUE DATE / تاريخ الإصدار</text>
    <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#E2E8F0">12 / 09 / 2026</text>
    <line x1="0" y1="52" x2="180" y2="52" stroke="#334155" stroke-width="1" />
    <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#10B981">● VERIFIED CREDENTIAL</text>
  </g>

  <!-- Golden Official Seal Emblem -->
  <g transform="translate(600, 715)">
    <circle cx="0" cy="0" r="48" fill="#0B1120" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="3 3" />
    <text x="0" y="-8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="url(#goldGrad)" text-anchor="middle">IBCT</text>
    <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#E2E8F0" text-anchor="middle">OFFICIAL</text>
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="7" fill="#38BDF8" text-anchor="middle">SEAL</text>
  </g>

  <g transform="translate(880, 680)">
    <text x="180" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B" text-anchor="end">CERTIFYING AUTHORITY</text>
    <text x="180" y="42" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="end">IBCT &amp; Edraak Platform</text>
    <line x1="0" y1="52" x2="180" y2="52" stroke="#334155" stroke-width="1" />
    <text x="180" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">AUTHENTIC ACADEMIC ASSET</text>
  </g>
</svg>
