<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="yemenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="50%" style="stop-color:#16213E"/>
      <stop offset="100%" style="stop-color:#0F3460"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#yemenBg)"/>
  
  <!-- Mountain silhouette -->
  <path d="M0,350 Q200,200 400,350 T800,350 L800,500 L0,500 Z" fill="#0A0A0B" opacity="0.8"/>
  <path d="M0,380 Q150,280 300,380 T600,380 T800,380 L800,500 L0,500 Z" fill="#121213" opacity="0.6"/>
  
  <!-- Gold geometric overlay -->
  <g stroke="#BE943F" stroke-width="1" fill="none" opacity="0.3">
    <rect x="50" y="50" width="200" height="120" rx="4"/>
    <rect x="550" y="330" width="200" height="120" rx="4"/>
    <circle cx="400" cy="250" r="80" stroke-dasharray="8 4"/>
    <circle cx="400" cy="250" r="40"/>
    <line x1="320" y1="250" x2="480" y2="250"/>
    <line x1="400" y1="170" x2="400" y2="330"/>
  </g>
  
  <!-- Yemen architecture hints -->
  <g fill="#BE943F" opacity="0.4">
    <rect x="180" y="320" width="30" height="80" rx="2"/>
    <rect x="220" y="300" width="25" height="100" rx="2"/>
    <rect x="580" y="330" width="28" height="70" rx="2"/>
    <rect x="620" y="310" width="22" height="90" rx="2"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="180" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#BE943F" text-anchor="middle" letter-spacing="0.12em" opacity="0.8">YEMEN</text>
  <text x="400" y="215" font-family="monospace" font-size="11" fill="#D9B567" text-anchor="middle" letter-spacing="0.08em">UNIVERSITY CAMPUS</text>
  <text x="400" y="420" font-family="monospace" font-size="10" fill="#9A9893" text-anchor="middle">PLACEHOLDER — 800×500px</text>
  <text x="400" y="440" font-family="monospace" font-size="10" fill="#6B6B6E" text-anchor="middle">yemen-about.webp</text>
</svg>