<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="nexoraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0B"/>
      <stop offset="100%" style="stop-color:#121213"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#nexoraBg)"/>
  <rect x="10" y="10" width="580" height="380" fill="none" stroke="#BE943F" stroke-width="1" rx="8" opacity="0.3"/>
  
  <!-- Web dashboard mockup -->
  <g fill="#1A1A1C" stroke="#2A2A2C" stroke-width="1">
    <rect x="40" y="40" width="520" height="320" rx="8"/>
    <rect x="40" y="40" width="520" height="50" rx="8" fill="#161B22"/>
    <circle cx="60" cy="65" r="8" fill="#FF5F57"/>
    <circle cx="85" cy="65" r="8" fill="#FFBD2E"/>
    <circle cx="110" cy="65" r="8" fill="#28CA42"/>
    <text x="200" y="72" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#BE943F">NEXORA</text>
    <text x="400" y="72" font-family="monospace" font-size="10" fill="#8B949E" text-anchor="end">Abdulghani Al-Shibami ▼</text>
  </g>
  
  <!-- Stats cards -->
  <g fill="#161B22" stroke="#30363D" stroke-width="1">
    <rect x="60" y="110" width="150" height="80" rx="8"/>
    <rect x="230" y="110" width="150" height="80" rx="8"/>
    <rect x="400" y="110" width="150" height="80" rx="8"/>
  </g>
  
  <g fill="#E6EDF3">
    <text x="80" y="140" font-family="monospace" font-size="20" font-weight="600" fill="#BE943F">99.99%</text>
    <text x="80" y="165" font-family="monospace" font-size="10" fill="#8B949E">Uptime</text>
    
    <text x="250" y="140" font-family="monospace" font-size="20" font-weight="600" fill="#58A6FF">2.4M</text>
    <text x="250" y="165" font-family="monospace" font-size="10" fill="#8B949E">Requests/Day</text>
    
    <text x="420" y="140" font-family="monospace" font-size="20" font-weight="600" fill="#A371F7">12ms</text>
    <text x="420" y="165" font-family="monospace" font-size="10" fill="#8B949E">Avg Latency</text>
  </g>
  
  <!-- Real-time chart -->
  <rect x="60" y="210" width="490" height="130" fill="#0D1117" rx="8" stroke="#30363D" stroke-width="1"/>
  <g stroke="#BE943F" stroke-width="2" fill="none" opacity="0.8">
    <path d="M80,310 Q150,260 220,290 T360,240 T520,270" stroke-dasharray="4 2"/>
  </g>
  <g stroke="#58A6FF" stroke-width="1.5" fill="none">
    <path d="M80,300 Q150,250 220,280 T360,230 T520,260"/>
  </g>
  <text x="80" y="230" font-family="monospace" font-size="10" fill="#8B949E">Real-time Throughput</text>
  <text x="520" y="230" font-family="monospace" font-size="10" fill="#BE943F" text-anchor="end">LIVE</text>
  
  <!-- Gold accent -->
  <line x1="60" y1="210" x2="550" y2="210" stroke="#BE943F" stroke-width="3"/>
  
  <text x="300" y="370" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#BE943F" text-anchor="middle" letter-spacing="0.1em">NEXORA PLATFORM</text>
  <text x="300" y="390" font-family="monospace" font-size="10" fill="#9A9893" text-anchor="middle">PLACEHOLDER — 600×400px • nexora.webp</text>
</svg>