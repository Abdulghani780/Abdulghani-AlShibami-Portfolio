<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600">
  <defs>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="50%" style="stop-color:#1B263B"/>
      <stop offset="100%" style="stop-color:#0A0A0B"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#BE943F;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#BE943F;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <rect width="1440" height="600" fill="url(#ctaBg)"/>
  <rect width="1440" height="600" fill="url(#goldGlow)"/>
  
  <!-- Mountain range bottom -->
  <path d="M0,450 Q360,250 720,450 T1440,450 L1440,600 L0,600 Z" fill="#0A0A0B" opacity="0.9"/>
  <path d="M0,480 Q280,350 560,480 T1120,480 T1440,480 L1440,600 L0,600 Z" fill="#121213" opacity="0.7"/>
  
  <!-- Gold geometric patterns -->
  <g stroke="#BE943F" stroke-width="1" fill="none" opacity="0.25">
    <circle cx="200" cy="150" r="60" stroke-dasharray="8 4"/>
    <circle cx="200" cy="150" r="30"/>
    <rect x="1100" y="80" width="280" height="160" rx="8"/>
    <circle cx="1240" cy="160" r="10" fill="#BE943F" opacity="0.6"/>
    <circle cx="1050" cy="400" r="80" stroke-dasharray="12 6"/>
  </g>
  
  <!-- Decorative nodes -->
  <g fill="#BE943F" opacity="0.4">
    <circle cx="300" cy="400" r="4"/>
    <circle cx="450" cy="380" r="3"/>
    <circle cx="800" cy="420" r="5"/>
    <circle cx="950" cy="390" r="3"/>
    <circle cx="1150" cy="410" r="4"/>
  </g>
  <g stroke="#BE943F" stroke-width="0.5" opacity="0.3">
    <line x1="300" y1="400" x2="450" y2="380"/>
    <line x1="450" y1="380" x2="800" y2="420"/>
    <line x1="800" y1="420" x2="950" y2="390"/>
    <line x1="950" y1="390" x2="1150" y2="410"/>
  </g>
  
  <!-- Text -->
  <text x="720" y="220" font-family="Georgia, serif" font-size="32" font-weight="600" fill="#BE943F" text-anchor="middle" letter-spacing="0.12em" opacity="0.6">YEMEN LANDSCAPE</text>
  <text x="720" y="260" font-family="monospace" font-size="12" fill="#D9B567" text-anchor="middle" letter-spacing="0.08em">WHERE THE JOURNEY BEGAN</text>
  <text x="720" y="520" font-family="monospace" font-size="11" fill="#9A9893" text-anchor="middle">PLACEHOLDER — 1440×600px</text>
  <text x="720" y="540" font-family="monospace" font-size="11" fill="#6B6B6E" text-anchor="middle">yemen-cta.webp • Gold Radial Fade</text>
</svg>