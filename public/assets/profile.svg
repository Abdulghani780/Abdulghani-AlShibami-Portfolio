<svg xmlns="http://www.w3.org/2000/svg" width="500" height="650" viewBox="0 0 500 650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0B"/>
      <stop offset="100%" style="stop-color:#121213"/>
    </linearGradient>
    <mask id="portraitMask">
      <rect x="50" y="50" width="400" height="550" fill="white" rx="8"/>
    </mask>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="650" fill="url(#bgGrad)"/>
  
  <!-- Gold geometric frame -->
  <rect x="10" y="10" width="480" height="630" fill="none" stroke="#BE943F" stroke-width="2" rx="12" opacity="0.6"/>
  <rect x="20" y="20" width="460" height="610" fill="none" stroke="#BE943F" stroke-width="1" rx="8" stroke-dasharray="16 8" opacity="0.4"/>
  
  <!-- Corner accents -->
  <g stroke="#BE943F" stroke-width="2" opacity="0.5">
    <path d="M40,30 L40,80 M30,40 L80,40"/>
    <path d="M460,30 L460,80 M420,40 L470,40"/>
    <path d="M40,620 L40,570 M30,610 L80,610"/>
    <path d="M460,620 L460,570 M420,610 L470,610"/>
  </g>
  
  <!-- Center transparent area indicator -->
  <circle cx="250" cy="325" r="120" fill="none" stroke="#BE943F" stroke-width="1" stroke-dasharray="8 4" opacity="0.3"/>
  <circle cx="250" cy="325" r="80" fill="none" stroke="#BE943F" stroke-width="1" stroke-dasharray="4 4" opacity="0.2"/>
  
  <!-- Text -->
  <text x="250" y="310" font-family="Georgia, serif" font-size="24" font-weight="600" fill="#BE943F" text-anchor="middle" letter-spacing="0.12em" opacity="0.8">PROFILE</text>
  <text x="250" y="345" font-family="monospace" font-size="11" fill="#9A9893" text-anchor="middle" letter-spacing="0.08em">TRANSPARENT PNG PLACEHOLDER</text>
  <text x="250" y="365" font-family="monospace" font-size="10" fill="#6B6B6E" text-anchor="middle">500×650px • Masked Bottom</text>
  
  <!-- Decorative gold lines -->
  <line x1="150" y1="420" x2="350" y2="420" stroke="#BE943F" stroke-width="1" opacity="0.3"/>
  <line x1="180" y1="450" x2="320" y2="450" stroke="#BE943F" stroke-width="1" opacity="0.2"/>
</svg>