  </defs>
  
  <rect width="400" height="712" fill="url(#screenBg)"/>
  <rect x="8" y="8" width="384" height="696" fill="none" stroke="#BE943F" stroke-width="1" rx="12" opacity="0.3"/>
  
  <rect x="16" y="16" width="368" height="680" fill="#0D1117" rx="8" stroke="#2A2A2C" stroke-width="1"/>
  
  <text x="200" y="40" font-family="monospace" font-size="10" fill="#8B949E" text-anchor="middle">9:41 AM  📶  🔋 100%</text>
  
