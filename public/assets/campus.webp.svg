<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="campusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0B"/>
      <stop offset="100%" style="stop-color:#121213"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#campusBg)"/>
  <rect x="10" y="10" width="580" height="380" fill="none" stroke="#BE943F" stroke-width="1" rx="8" opacity="0.3"/>
  
  <!-- Desktop app mockup -->
  <g fill="#1A1A1C" stroke="#2A2A2C" stroke-width="1">
    <rect x="40" y="40" width="520" height="320" rx="8"/>
    <rect x="40" y="40" width="520" height="40" rx="8" fill="#161B22"/>
    <circle cx="60" cy="60" r="8" fill="#FF5F57"/>
    <circle cx="85" cy="60" r="8" fill="#FFBD2E"/>
    <circle cx="110" cy="60" r="8" fill="#28CA42"/>
  </g>
  
  <!-- Sidebar -->
  <rect x="40" y="100" width="180" height="240" fill="#161B22" stroke="#2A2A2C" stroke-width="1"/>
  <g fill="#E6EDF3">
    <text x="60" y="130" font-family="monospace" font-size="11" font-weight="600">CAMPUS IT</text>
    <text x="60" y="170" font-family="monospace" font-size="10">📊 Dashboard</text>
    <text x="60" y="195" font-family="monospace" font-size="10" fill="#BE943F">👥 Students</text>
    <text x="60" y="220" font-family="monospace" font-size="10">📚 Courses</text>
    <text x="60" y="245" font-family="monospace" font-size="10">📅 Schedule</text>
    <text x="60" y="270" font-family="monospace" font-size="10">⚙️ Settings</text>
  </g>
  
  <!-- Main content -->
  <rect x="240" y="100" width="320" height="240" fill="#0D1117" stroke="#2A2A2C" stroke-width="1" rx="4"/>
  <g fill="#E6EDF3">
    <text x="260" y="130" font-family="monospace" font-size="12" font-weight="600">Student Management</text>
    <text x="260" y="160" font-family="monospace" font-size="10" fill="#8B949E">Total: 2,847 students</text>
    <text x="260" y="185" font-family="monospace" font-size="10" fill="#3FB950">Active: 2,631</text>
    <text x="260" y="210" font-family="monospace" font-size="10" fill="#F85149">On Leave: 124</text>
    <text x="260" y="235" font-family="monospace" font-size="10" fill="#A371F7">Graduated: 92</text>
  </g>
  
  <!-- Gold accent -->
  <line x1="240" y1="100" x2="560" y2="100" stroke="#BE943F" stroke-width="3"/>
  
  <text x="300" y="370" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#BE943F" text-anchor="middle" letter-spacing="0.1em">CAMPUS IT TRACKER</text>
  <text x="300" y="390" font-family="monospace" font-size="10" fill="#9A9893" text-anchor="middle">PLACEHOLDER — 600×400px • campus.webp</text>
</svg>